<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="homeWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141c2e"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a201c"/>
      <stop offset="100%" stop-color="#1a1412"/>
    </linearGradient>
    <filter id="hShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Bedroom Wall -->
  <rect width="800" height="300" fill="url(#homeWall)"/>

  <!-- Window with sunset / evening light -->
  <rect x="520" y="40" width="220" height="180" rx="8" fill="#1e293b" stroke="#475569" stroke-width="4"/>
  <rect x="535" y="55" width="90" height="70" fill="#f97316" opacity="0.3"/>
  <rect x="635" y="55" width="90" height="70" fill="#f97316" opacity="0.3"/>
  <rect x="535" y="135" width="90" height="70" fill="#f43f5e" opacity="0.2"/>
  <rect x="635" y="135" width="90" height="70" fill="#f43f5e" opacity="0.2"/>

  <!-- Wooden Floor -->
  <polygon points="0,300 800,300 800,500 0,500" fill="url(#floorGrad)"/>
  <line x1="0" y1="300" x2="800" y2="300" stroke="#78350f" stroke-width="3"/>

  <!-- Duffel / Weekend Travel Bag on Floor -->
  <g id="weekend-bag" filter="url(#hShadow)">
    <rect x="250" y="320" width="300" height="140" rx="40" fill="#0369a1" stroke="#0284c7" stroke-width="2"/>
    <!-- Bag handles -->
    <path d="M 330 320 C 330 250 470 250 470 320" fill="none" stroke="#0c4a6e" stroke-width="12" stroke-linecap="round"/>
    <path d="M 330 320 C 330 250 470 250 470 320" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <!-- Zipper -->
    <line x1="280" y1="340" x2="520" y2="340" stroke="#f1f5f9" stroke-width="2.5" stroke-dasharray="4,2"/>
    <circle cx="390" cy="340" r="5" fill="#e2e8f0"/>
    <!-- Side pocket -->
    <rect x="280" y="370" width="240" height="65" rx="8" fill="#075985"/>
    <text x="365" y="408" font-size="12" font-family="sans-serif" font-weight="bold" fill="#bae6fd">HOME SWEET HOME</text>
  </g>

  <!-- Dirty Laundry Bag (Hostel -> Home essential to bring clothes for washing!) -->
  <g id="laundry-bag" filter="url(#hShadow)">
    <path d="M 90 280 Q 140 260 170 300 Q 185 390 160 450 Q 80 460 70 390 Z" fill="#64748b" stroke="#94a3b8" stroke-width="2"/>
    <!-- Drawstring cinched top -->
    <ellipse cx="130" cy="285" rx="30" ry="12" fill="#475569"/>
    <path d="M 130 285 Q 150 250 170 260" fill="none" stroke="#f1f5f9" stroke-width="3" stroke-linecap="round"/>
    <text x="95" y="380" font-size="10" font-family="sans-serif" font-weight="bold" fill="#f8fafc">LAUNDRY BAG</text>
    <text x="100" y="395" font-size="8" font-family="sans-serif" fill="#cbd5e1">To Wash at Home</text>
  </g>

  <!-- Toiletry Kit / Dopp Bag on bedside chair -->
  <g id="toiletry-kit" filter="url(#hShadow)">
    <rect x="600" y="340" width="120" height="80" rx="14" fill="#15803d" stroke="#22c55e" stroke-width="2"/>
    <line x1="610" y1="365" x2="710" y2="365" stroke="#86efac" stroke-width="2"/>
    <text x="620" y="390" font-size="10" font-weight="bold" fill="#ffffff">TOILETRIES</text>
    <text x="618" y="405" font-size="8" fill="#dcfce7">Toothbrush + Meds</text>
  </g>

  <!-- Casual Sneakers by the bag -->
  <g id="sneakers" filter="url(#hShadow)">
    <ellipse cx="610" cy="455" rx="45" ry="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <ellipse cx="690" cy="455" rx="45" ry="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <path d="M 580 455 Q 610 440 645 455" fill="none" stroke="#f43f5e" stroke-width="4"/>
    <path d="M 660 455 Q 690 440 725 455" fill="none" stroke="#f43f5e" stroke-width="4"/>
  </g>

  <!-- House Keys & Metro Pass -->
  <g id="home-keys" filter="url(#hShadow)">
    <circle cx="205" cy="430" r="10" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
    <rect x="210" y="428" width="25" height="5" rx="1" fill="#d97706"/>
    <rect x="180" y="445" width="55" height="32" rx="4" fill="#3b82f6" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="186" y="465" font-size="8" font-family="sans-serif" font-weight="bold" fill="#ffffff">METRO CARD</text>
  </g>
</svg>

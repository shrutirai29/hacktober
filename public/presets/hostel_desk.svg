<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="laptopGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Wall & Room Background -->
  <rect width="800" height="320" fill="url(#wallGrad)"/>
  
  <!-- Bulletin Board on Wall -->
  <rect x="60" y="40" width="220" height="140" rx="8" fill="#451a03" stroke="#78350f" stroke-width="4" filter="url(#shadow)"/>
  <rect x="70" y="50" width="200" height="120" rx="4" fill="#b45309" opacity="0.3"/>
  <!-- Sticky notes & hostel notices -->
  <rect x="85" y="65" width="45" height="45" rx="3" fill="#fef08a" transform="rotate(-4 85 65)"/>
  <text x="92" y="90" font-size="10" font-family="sans-serif" fill="#713f12" font-weight="bold">Hostel Gate</text>
  <text x="92" y="102" font-size="9" font-family="sans-serif" fill="#713f12">Closes 10PM</text>
  <rect x="145" y="70" width="50" height="45" rx="3" fill="#fed7aa" transform="rotate(3 145 70)"/>
  <text x="150" y="94" font-size="9" font-family="sans-serif" fill="#9a3412" font-weight="bold">Exam Timetable</text>
  <rect x="210" y="80" width="45" height="45" rx="3" fill="#a7f3d0" transform="rotate(-2 210 80)"/>
  <text x="215" y="105" font-size="9" font-family="sans-serif" fill="#065f46" font-weight="bold">Laundry Day!</text>

  <!-- Wall Power Outlet (High risk forgotten spot!) -->
  <g id="wall-outlet">
    <rect x="660" y="190" width="70" height="85" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="675" y="205" width="40" height="55" rx="4" fill="#e2e8f0"/>
    <!-- Socket pins -->
    <circle cx="695" cy="220" r="4" fill="#475569"/>
    <circle cx="685" cy="242" r="3.5" fill="#475569"/>
    <circle cx="705" cy="242" r="3.5" fill="#475569"/>
    <!-- Charger Adapter plugged into wall -->
    <rect x="680" y="215" width="48" height="42" rx="4" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="686" y="238" font-size="8" fill="#38bdf8" font-family="monospace">65W PD</text>
    <!-- Trailing Charger Cable down to desk -->
    <path d="M 705 257 Q 720 310 640 370" fill="none" stroke="#0ea5e9" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 640 370 Q 560 410 440 395" fill="none" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Desk Surface -->
  <polygon points="0,320 800,320 800,500 0,500" fill="url(#deskGrad)"/>
  <line x1="0" y1="320" x2="800" y2="320" stroke="#64748b" stroke-width="3"/>

  <!-- Open Laptop on Desk -->
  <g id="laptop" filter="url(#shadow)">
    <!-- Base -->
    <polygon points="260,370 540,370 570,430 230,430" fill="url(#laptopGrad)" stroke="#64748b" stroke-width="1.5"/>
    <!-- Trackpad -->
    <rect x="360" y="405" width="80" height="20" rx="3" fill="#1e293b" opacity="0.6"/>
    <!-- Keyboard area -->
    <rect x="280" y="375" width="240" height="26" rx="2" fill="#0f172a" opacity="0.8"/>
    <!-- Screen tilted back -->
    <polygon points="280,210 520,210 540,370 260,370" fill="#020617" stroke="#475569" stroke-width="2"/>
    <!-- Display glass glow -->
    <polygon points="290,220 510,220 530,360 270,360" fill="#0f172a"/>
    <text x="345" y="280" font-size="13" font-family="monospace" fill="#38bdf8" font-weight="bold">CheckMate AI</text>
    <text x="330" y="300" font-size="10" font-family="monospace" fill="#94a3b8">> Room Scan: Ready</text>
    <!-- Laptop Apple/Brand icon -->
    <circle cx="400" cy="245" r="7" fill="#38bdf8" opacity="0.4"/>
  </g>

  <!-- Hostel College Student ID Card (Commonly forgotten!) -->
  <g id="id-card" filter="url(#shadow)">
    <rect x="110" y="380" width="95" height="60" rx="6" fill="#f8fafc" stroke="#dc2626" stroke-width="2" transform="rotate(-8 110 380)"/>
    <rect x="115" y="385" width="28" height="32" rx="3" fill="#cbd5e1" transform="rotate(-8 110 380)"/>
    <text x="150" y="400" font-size="8" font-family="sans-serif" font-weight="bold" fill="#0f172a">HOSTEL PASS</text>
    <text x="150" y="412" font-size="7" font-family="sans-serif" fill="#64748b">ID: 2026-CS-89</text>
    <text x="150" y="424" font-size="7" font-family="sans-serif" fill="#ef4444" font-weight="bold">BLOCK C - 402</text>
    <!-- Lanyard strap -->
    <path d="M 105 385 Q 70 370 40 420" fill="none" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Earbuds Case on Desk -->
  <g id="earbuds" filter="url(#shadow)">
    <rect x="180" y="340" width="45" height="32" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="202" cy="356" r="2.5" fill="#10b981"/>
  </g>

  <!-- Water Bottle / Thermos Flask -->
  <g id="water-bottle" filter="url(#shadow)">
    <rect x="580" y="270" width="45" height="130" rx="12" fill="#0284c7" stroke="#0369a1" stroke-width="2"/>
    <rect x="590" y="255" width="25" height="18" rx="4" fill="#0369a1"/>
    <!-- Metallic grip ring -->
    <line x1="580" y1="310" x2="625" y2="310" stroke="#e0f2fe" stroke-width="3"/>
  </g>

  <!-- Room Key & Keychain Ring -->
  <g id="keys" filter="url(#shadow)">
    <circle cx="640" cy="420" r="12" fill="none" stroke="#f59e0b" stroke-width="3"/>
    <!-- Key 1 -->
    <rect x="645" y="418" width="30" height="6" rx="2" fill="#d97706"/>
    <rect x="665" y="424" width="4" height="6" fill="#d97706"/>
    <rect x="672" y="424" width="3" height="4" fill="#d97706"/>
    <!-- Room tag fob -->
    <rect x="625" y="430" width="35" height="18" rx="4" fill="#ef4444"/>
    <text x="630" y="443" font-size="9" font-family="sans-serif" font-weight="bold" fill="#ffffff">#402</text>
  </g>

  <!-- Power Bank / Portable Charger -->
  <g id="powerbank" filter="url(#shadow)">
    <rect x="470" y="410" width="85" height="45" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.5" transform="rotate(5 470 410)"/>
    <!-- Battery LED indicators -->
    <circle cx="485" cy="425" r="2" fill="#10b981"/>
    <circle cx="493" cy="425" r="2" fill="#10b981"/>
    <circle cx="501" cy="425" r="2" fill="#10b981"/>
    <circle cx="509" cy="425" r="2" fill="#64748b"/>
    <text x="485" y="445" font-size="8" font-family="monospace" fill="#94a3b8">20000mAh</text>
  </g>
</svg>

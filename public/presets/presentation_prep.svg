<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="presWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="tableGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="pShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Conference / Bedroom Wall -->
  <rect width="800" height="310" fill="url(#presWall)"/>

  <!-- Presentation Poster / Whiteboard on Wall -->
  <rect x="220" y="30" width="360" height="150" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="2" filter="url(#pShadow)"/>
  <text x="245" y="70" font-size="18" font-family="sans-serif" font-weight="bold" fill="#f8fafc">AI Innovation Summit 2026</text>
  <text x="245" y="95" font-size="12" font-family="sans-serif" fill="#a5b4fc">Speaker: Final Year Project Demo (10:30 AM)</text>
  <line x1="245" y1="110" x2="550" y2="110" stroke="#4338ca" stroke-width="1.5"/>
  <rect x="245" y="125" width="80" height="24" rx="4" fill="#4338ca"/>
  <text x="255" y="141" font-size="10" font-family="sans-serif" fill="#ffffff" font-weight="bold">SLIDES READY</text>
  <rect x="335" y="125" width="110" height="24" rx="4" fill="#ef4444" opacity="0.9"/>
  <text x="342" y="141" font-size="9" font-family="sans-serif" fill="#ffffff" font-weight="bold">NEED HDMI ADAPTER!</text>

  <!-- Chair with Draped Formal Blazer -->
  <g id="blazer-chair" filter="url(#pShadow)">
    <!-- Chair back -->
    <rect x="40" y="160" width="140" height="220" rx="14" fill="#334155" stroke="#475569" stroke-width="3"/>
    <!-- Blazer hanging on chair -->
    <path d="M 50 170 Q 110 150 170 170 L 175 320 Q 110 330 45 320 Z" fill="#1e1b4b" stroke="#312e81" stroke-width="2"/>
    <!-- Blazer lapels & collar -->
    <polygon points="110,175 90,240 110,245 130,240" fill="#312e81"/>
    <!-- Pocket square -->
    <polygon points="75,230 85,220 90,230" fill="#f43f5e"/>
    <!-- Presentation Lanyard / Speaker Badge pinned to blazer -->
    <rect x="95" y="250" width="35" height="48" rx="4" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="100" y="270" font-size="7" font-weight="bold" fill="#1e1b4b">SPEAKER</text>
    <text x="102" y="285" font-size="6" fill="#64748b">STAGE A</text>
  </g>

  <!-- Table Surface -->
  <polygon points="0,310 800,310 800,500 0,500" fill="url(#tableGrad)"/>
  <line x1="0" y1="310" x2="800" y2="310" stroke="#475569" stroke-width="2.5"/>

  <!-- Laptop with Presentation Deck open -->
  <g id="pres-laptop" filter="url(#pShadow)">
    <polygon points="340,360 620,360 650,430 310,430" fill="#475569" stroke="#64748b" stroke-width="1.5"/>
    <rect x="440" y="405" width="80" height="20" rx="3" fill="#0f172a" opacity="0.6"/>
    <polygon points="360,200 600,200 620,360 340,360" fill="#020617" stroke="#475569" stroke-width="2"/>
    <polygon points="370,210 590,210 610,350 350,350" fill="#1e1b4b"/>
    <!-- Slide on laptop screen -->
    <text x="390" y="260" font-size="14" font-family="sans-serif" font-weight="bold" fill="#818cf8">CheckMate Presentation</text>
    <text x="390" y="285" font-size="10" font-family="sans-serif" fill="#c7d2fe">Slide 1 / 15: Introduction</text>
    <circle cx="560" cy="270" r="16" fill="#4f46e5" opacity="0.7"/>
  </g>

  <!-- USB-C to HDMI Multi-Port Adapter / Dongle (CRITICAL Presentation item!) -->
  <g id="hdmi-dongle" filter="url(#pShadow)">
    <!-- Dongle aluminum hub -->
    <rect x="635" y="380" width="75" height="35" rx="5" fill="#94a3b8" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- HDMI Port on side -->
    <rect x="685" y="390" width="20" height="15" rx="2" fill="#0f172a"/>
    <text x="642" y="400" font-size="8" font-family="monospace" font-weight="bold" fill="#1e293b">USB-C HUB</text>
    <text x="642" y="410" font-size="7" font-family="sans-serif" fill="#334155">HDMI + 4K</text>
    <!-- Short braided cable to laptop -->
    <path d="M 635 397 Q 615 390 600 395" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Wireless Presentation Clicker / Slide Remote -->
  <g id="slide-clicker" filter="url(#pShadow)">
    <rect x="235" y="360" width="30" height="70" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" transform="rotate(15 235 360)"/>
    <circle cx="258" cy="385" r="6" fill="#f43f5e"/>
    <polygon points="255,405 262,400 262,410" fill="#94a3b8"/>
    <polygon points="262,425 255,420 255,430" fill="#94a3b8"/>
  </g>

  <!-- Speaker Notes Binder / Notebook -->
  <g id="speaker-notes" filter="url(#pShadow)">
    <rect x="200" y="425" width="90" height="60" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" transform="rotate(-6 200 425)"/>
    <!-- Spiral binding rings -->
    <circle cx="196" cy="435" r="3" fill="#475569"/>
    <circle cx="195" cy="450" r="3" fill="#475569"/>
    <circle cx="194" cy="465" r="3" fill="#475569"/>
    <line x1="210" y1="440" x2="280" y2="440" stroke="#94a3b8" stroke-width="2"/>
    <line x1="210" y1="452" x2="275" y2="452" stroke="#94a3b8" stroke-width="2"/>
    <text x="210" y="475" font-size="8" font-family="sans-serif" font-weight="bold" fill="#4338ca">DEMO CHECKLIST</text>
  </g>

  <!-- Compact Travel Umbrella (Weather: Rainy) -->
  <g id="umbrella" filter="url(#pShadow)">
    <rect x="715" y="320" width="35" height="150" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2" transform="rotate(12 715 320)"/>
    <path d="M 750 460 Q 765 480 750 495" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
    <text x="705" y="400" font-size="8" font-family="monospace" fill="#38bdf8" transform="rotate(102 705 400)">RAIN PROOF</text>
  </g>
</svg>

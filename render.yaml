services:
  # Python FastAPI Backend for TabPFN & Gemma 2 Gateway
  - type: web
    name: canopy-ai-backend
    env: python
    region: oregon
    plan: standard
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.canopy_server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production

  # Static Frontend Site (React 19 + Vite + Tailwind CSS)
  - type: web
    name: canopy-ai-frontend
    env: static
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

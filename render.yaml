# Render Blueprint Specification for CheckMate
# Target Prize Category: Best Use of Render ($200)
# Deploys Vite Frontend + Python Gemma AI Runtime Worker

services:
  # 1. Front-end Web Service
  - type: web
    name: checkmate-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_BACKEND_URL
        fromService:
          type: web
          name: checkmate-ai-runtime
          property: host

  # 2. AI Runtime Engine (Gemma & TabPFN Backend)
  - type: web
    name: checkmate-ai-runtime
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python backend/gemma_engine.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OLLAMA_HOST
        value: http://localhost:11434
      - key: TABPFN_MODEL_MODE
        value: in_context_foundation_prior
      - key: SENTRY_ENVIRONMENT
        value: production

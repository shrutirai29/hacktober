name: canopy-ai
region: nyc
services:
  - name: backend-api
    github:
      branch: main
      deploy_on_push: true
    source_dir: backend
    build_command: pip install -r ../requirements.txt
    run_command: uvicorn canopy_server:app --host 0.0.0.0 --port 8080
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /api

static_sites:
  - name: frontend
    github:
      branch: main
      deploy_on_push: true
    source_dir: /
    build_command: npm install && npm run build
    output_dir: dist
    routes:
      - path: /

name: CheckMate CI/CD & GitHub Copilot Code Quality
# Target Prize Category: Best Use of GitHub Copilot ($100)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Vite Application
        run: npm run build

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: pip install -r requirements.txt

      - name: Test TabPFN & Sponsor Endpoints
        run: |
          python -c "import backend.sponsor_engine as se; print(se.run_tabpfn_prediction('65W Laptop Charger'))"
          python -c "import backend.sponsor_engine as se; print(se.run_tinker_benchmark())"
          python -c "import backend.sponsor_engine as se; print(se.run_arduino_telemetry())"
